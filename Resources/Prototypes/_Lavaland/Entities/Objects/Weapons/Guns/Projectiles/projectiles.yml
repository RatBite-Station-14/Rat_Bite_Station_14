- type: entity
  id: BulletKinetic
  name: kinetic bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Reflective
    reflective:
    - NonEnergy
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 15 # Ratbite - bevv the base PKA is NOT meta, stop nerfing it for fucks sake..
        Structural: 20 # Ratbite re add
      armorPenetration: -0.5 # Ratbite, balance against antags/sec still a murder weapon keep away from tidas
  # Short lifespan
  - type: TimedDespawn
    lifetime: 0.22 # Ratbite - roughly 5.5 tiles
  - type: GatheringProjectile # Ratbite

- type: entity
  id: BulletKineticShuttle
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 80 # Ratbite - 40 > 80
  - type: Ammo
    muzzleFlash: HitscanEffect
  - type: TimedDespawn
    lifetime: 0.3
  - type: PointLight
    radius: 2.5
    color: white
    energy: 0.5
  - type: GatheringProjectile # Ratbite

- type: entity
  id: RapidBulletKinetic # Used for PK repeater and pistol
  name: rapid kinetic bolt
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 6.5
        Structural: 8

- type: entity
  id: WeakBulletKinetic
  categories: [ HideSpawnMenu ]
  parent: BulletKinetic
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 3
        Structural: 5

- type: entity
  id: PelletKinetic
  categories: [ HideSpawnMenu ]
  parent: WeakBulletKinetic

- type: entity
  id: PelletKineticSpread
  categories: [ HideSpawnMenu ]
  parent: PelletKinetic
  components:
  - type: ProjectileSpread
    proto: PelletKinetic
    count: 6
    spread: 30
