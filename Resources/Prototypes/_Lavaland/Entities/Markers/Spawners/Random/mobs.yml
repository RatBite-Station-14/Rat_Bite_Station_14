- type: entityTable
  id: LavalandMobs
  table: !type:GroupSelector
    children:
    - id: MobLegion
    - !type:GroupSelector
      weight: 50
      children:
      - id: MobLavalandGoliath
        weight: 99
      - id: MobLavalandGoliathAncient
        weight: 1

- type: entityTable
  id: LavalandLightMobs
  table: !type:GroupSelector
    children:
    - id: MobCarpDungeon
    - !type:GroupSelector
      weight: 15
      children:
      - id: MobWatcherIcewing
      - id: MobWatcherLavaland
      #- id: LavalandTendrilLegion


- type: entity
  name: lavaland mob spawner
  id: SpawnerRandomMobLavaland
  parent: ProximitySpawnerBase
  suffix: Lavaland, Proximity
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath
  - type: SpawnTableOnTrigger
    table: !type:NestedSelector
      tableId: LavalandMobs
  placement:
    mode: AlignTileAny


- type: entity
  name: lavaland light mob spawner
  id: SpawnerRandomLightMobLavaland
  parent: ProximitySpawnerBase
  suffix: Lavaland, Proximity
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath
  - type: SpawnTableOnTrigger
    table: !type:NestedSelector
      tableId: LavalandLightMobs
