  name: interdyne pharmaceuticals haemostatic kaolin granule packet
  description: Advanced haemostatic granules, each grain hand crafted with immaculate care by our finest chemists at interdyne pharmaceuticals. There's a little symbol scribbled out by a marker on the back...
  components:
  - type: Item
    size: Tiny
  - type: Openable
    sound:
