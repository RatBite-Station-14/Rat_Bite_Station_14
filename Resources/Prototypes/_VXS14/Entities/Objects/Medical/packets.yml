        maxVol: 40
        reagents:
        - ReagentId: KaolinPowder
          Quantity: 40
  - type: SolutionTransfer
    maxTransferAmount: 10
  - type: ExaminableSolution
    solution: food
  - type: Sprite
    sprite: _VXS14/Objects/Medical/medical.rsi
    state: kaolininterdyne
  - type: Icon
    sprite: _VXS14/Objects/Medical/medical.rsi
    state: kaolininterdyne
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: Tag
    tags:
      - Packet
  - type: Appearance
  - type: MeleeWeapon
    soundNoDamage:
