- type: entity
  id: MobRevenantToken
  parent: MobRevenant
  name: revenant
  description: A spooky ghostie.
  components:
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-revenant-name-token
    description: ghost-role-information-description-token-generic
    rules: ghost-role-information-antagonist-rules
    raffle:
      settings: default
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 18000

- type: entity
  name: Skibidi Toilet
  id: MobSkibidiToilet
  parent: SimpleMobBase
  description: Skibidi dop dop dop yes yes
  components:
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
    - type: Sprite
      drawdepth: Mobs
      sprite: _Goobstation/Mobs/Demons/skibidi.rsi
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          state: alive
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.30
          density: 80
          mask:
            - MobMask
          layer:
            - MobLayer
    - type: DamageStateVisuals
      states:
        Alive:
          Base: alive
        Dead:
          Base: dead
    - type: MobThresholds
      thresholds:
        0: Alive
        100: Dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 1.5 # literally 1984
      baseSprintSpeed: 3.75 # literally 1984
    - type: Tag
      tags:
        - FootstepSound
    - type: HitscanBatteryAmmoProvider
      proto: RedLightLaser
      fireCost: 50
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 50
    - type: Battery
      maxCharge: 1000
      startingCharge: 1000
    - type: Gun
      fireRate: 1
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/_Goobstation/Animals/skibidi.wav
    - type: CombatMode
    - type: InteractionPopup
      successChance: 0.3
      interactSuccessString: petting-success-skibidi-toilet
      interactFailureString: petting-failure-skibidi-toilet
      interactSuccessSound:
        path: /Audio/_Goobstation/Animals/skibidi.wav
    - type: GhostRole
      makeSentient: true
      allowSpeech: true
      allowMovement: true
      name: ghost-role-information-skibidi-toilet-name
      description: ghost-role-information-skibidi-toilet-description
      rules: ghost-role-information-skibidi-toilet-rules
      mindRoles:
      - MindRoleGhostRoleTeamAntagonist
      raffle:
        settings: short
    - type: GhostTakeoverAvailable
    - type: Speech
      speechVerb: SmallMob
      speechSounds: Squeak
    - type: OhioAccent
    