  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  canBeAntag: false
  guides:
  - NanotrasenRepSOP
  - SOP
  - SpaceLaw
  - Writing
  goobcoins: 40
  access:
  - Security
  - Brig
  - External
  - Cryogenics
  - Maintenance
  - Engineering
  - Medical
  - Research
  - Command
  - CentralCommand
  - Service
  - Hydroponics
  - Kitchen
  - Cargo
  - Theatre
  - NanotrasenRepresentative
