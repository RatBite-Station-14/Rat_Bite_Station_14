      requiredAge: 21
    - !type:SpeciesRequirement # Ratbite Bill of Rights "non sentient" species.
      inverted: true
      species:
      - Felinid
      - Scurret
      - Monkey
      - Kobold
    - !type:TraitsRequirement # Ratbite: No NRP traits
      inverted: true
