- type: job
  id: Brigmedic
  name: job-name-brigmedic
  description: job-description-brigmedic
  playTimeTracker: JobBrigmedic
  requirements:
  - !type:DepartmentTimeRequirement
    department: Medical
    time: 3600 # 1 hrs
  - !type:DepartmentTimeRequirement
    department: Security
    time: 3600 # 1 hrs
  - !type:SpeciesRequirement # Ratbite Bill of Rights "non sentient" species.
      inverted: true
      species:
      - Felinid
      - Scurret
      - Monkey
      - Kobold
  - !type:TraitsRequirement # Ratbite: No NRP traits
    inverted: true
    traits:
    - Trigger
    - SocialAnxietyTrait
    - ChronicKleptomania
    - Nudist
    - Stowaway
  startingGear: BrigmedicGear
  icon: "JobIconBrigmedic"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides:
  - MedicalDoctor
  - BrigmedicSOP
  - Medicine
  goobcoins: 45 # Ratbite - increased
  access: # EE parity, make corpsman able function.
  - Security
  - Brig
  - Medical
  - Maintenance
  - Service
  - External
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: SecurityStaff
  - !type:AddComponentSpecial
    components:
    - type: SurgerySpeedModifier
      speedModifier: 1.5 # Ratbite - parity with medical doctor

