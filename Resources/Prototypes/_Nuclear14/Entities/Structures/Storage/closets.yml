- type: entity
  parent: N14ClosetBaseW
  id: N14ClosetDouble
  name: double closet
  description: A double closet for holding twice the things.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/Closets/doublecloset.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.15,-0.45,0.45,0.45"
        density: 145
        mask:
        - MachineMask
        layer:
        - MachineLayer

# Wooden Closets

- type: entity
  parent: N14ClosetBase
  id: N14ClosetCabinetWood
  name: cabinet
  description: An old pre-war wooden cabinet.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/Closets/cabinet.rsi
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Wooden


