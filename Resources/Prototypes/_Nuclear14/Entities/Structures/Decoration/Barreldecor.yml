# barrel Decor
- type: entity
  parent: N14DecorFloorBase
  id: N14DecorFloorBarrelBase
  abstract: true
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Decoration/barrels.rsi
    snapCardinals: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.25"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Climbable
  - type: Physics
    bodyType: Static
    canCollide: true

#grey
- type: entity
  parent: N14DecorFloorBarrelBase
  id: N14DecorBarrelsgrey
  name: grey barrels
  description: a bunch of gray barrels.
  components:
