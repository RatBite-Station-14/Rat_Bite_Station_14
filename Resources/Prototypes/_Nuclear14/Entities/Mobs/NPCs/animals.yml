  parent: N14MobBaseSimple
  description: Damn, that's a sandy rat.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: desertrat
      sprite: _Nuclear14/Mobs/Animals/desertrat.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 4
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-biggie-cheese-name
    description: ghost-role-information-biggie-cheese-description
  - type: GhostTakeoverAvailable
  - type: Speech
    speechSounds: Squeak
    speechVerb: SmallMob
  - type: LanguageKnowledge
