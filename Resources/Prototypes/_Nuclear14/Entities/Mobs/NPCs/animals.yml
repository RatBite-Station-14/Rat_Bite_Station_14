 #Radhog
 
- type: entity
  name: Radhog
  id: N14MobRadhog
  parent: N14MobBaseHostile
  description: Big, Angry and ready to mess you up.
  components:
  - type: LanguageKnowledge
    speaks:
    - Pig
    understands:
    - Pig
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: radhog
      sprite: _Nuclear14/Mobs/Animals/radhog.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.20
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: InteractionPopup
    successChance: 0.7
    interactSuccessString: petting-success-pig
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/pig_oink.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: pigrat
      Critical:
        Base: pigrat
      Dead:
        Base: dead
  - type: MeleeThrowOnHit
    speed: 3
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      groups:
        Brute: 3
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 3