#MARK: Iguana
- type: entity
  parent: N14MobBaseSimple
  id: N14MobIguana
  name: iguana
  description: Little green food... I mean friend.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: iguana
      sprite: _Nuclear14/Mobs/Animals/iguana.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: iguana
      Dead:
        Base: dead
  - type: Stamina
    critThreshold: 20
  - type: Butcherable
    spawned:
    - id: FoodMeatLizard
      amount: 1
      prob: 0.95
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WastelandAnimal
