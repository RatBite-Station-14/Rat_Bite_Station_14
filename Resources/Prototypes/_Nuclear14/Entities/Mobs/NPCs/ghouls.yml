#MARK: Maypole
- type: entity
  parent: N14MobBaseHostileFeral
  id: N14MobGhoulMaypole
  name: Maypole
  description: A special looking ghoul towering over most everything.
  components:
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: N14ToughAnimal
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Brute: 30
        Slash: 10
    range: 2.5
  - type: MeleeThrowOnHit
    speed: 15
    lifetime: 0.025
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.925
        Slash: 0.925
        Piercing: 0.95
        Heat: 0.95
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
      sprite: _Nuclear14/Mobs/Ghouls/maypole.rsi
  - type: PointLight
    radius: 2
    energy: 0.5
    color: "#4CBB17FF"
  - type: MovementSpeedModifier
    baseWalkSpeed : 5
    baseSprintSpeed : 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.7
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead

#ghoul sounds

- type: soundCollection
