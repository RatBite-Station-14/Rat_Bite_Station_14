- type: entity
  name: Feral Ghoul
  id: N14MobGhoulFeral
  parent: N14MobBaseHostileFeral
  description: A mean looking ghoul.
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 3.5
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Slash: 7
    range: 1
  - type: Sprite
    drawdepth: Mobs
    sprite: _Nuclear14/Mobs/Ghouls/ghoul.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: ghoul
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: unshaded
      shader: unshaded
  
