# See basemob.yml for parent entities
#MARK: Giant Ant
- type: entity
  name: giant ant
  parent: N14MobBaseHostileInsect
  id: N14MobGiantAnt
  description: It's an ant...but giant. Watch for the nippers.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: giantant
      sprite: _Nuclear14/Mobs/Insects/giantant.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.3
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: giantant
      Critical:
        Base: giantant
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 2
  - type: Bloodstream
    bloodMaxVolume: 500
  - type: Temperature
    heatDamageThreshold: 500
    coldDamageThreshold: 0
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 60
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    damage:
      groups:
        Brute: 5

#MARK: Giant Fire Ant
- type: entity
  name: giant fire ant
  parent: N14MobGiantAnt
  id: N14MobGiantFireAnt
  description: It's an ant...but giant and red. Watch for the nippers and bring some ointment.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: fireant
      sprite: _Nuclear14/Mobs/Insects/fireant.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: fireant
      Critical:
        Base: fireant
      Dead:
        Base: dead
  - type: SolutionContainerManager
    solutions:
      melee:
        reagents:
        - ReagentId: InsectBlood
          Quantity: 10
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 0.1
  - type: Butcherable
    spawned:
    - id: FoodMeat

#MARK: Radroach
- type: entity
  name: radroach
  id: N14MobRadroach
  parent: N14MobBaseHostileInsect
  description: Stinking roaches survived the bombs.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: radroach
      scale: 0.75, 0.75
      sprite: _Nuclear14/Mobs/Insects/radroach.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.20
        density: 20
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: radroach
      Critical:
        Base: radroach
      Dead:
        Base: dead
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      groups:
        Brute: 2
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1

