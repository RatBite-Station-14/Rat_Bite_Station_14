    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: radscorpion
      sprite: _Nuclear14/Mobs/Insects/radscorpion.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.3
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: radscorpion
      Critical:
        Base: radscorpion
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1
  - type: Bloodstream
    bloodMaxVolume: 500
  - type: Temperature
    heatDamageThreshold: 500
    coldDamageThreshold: 0
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 60
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    damage:
      types:
        Slash: 2
        Piercing: 8
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 10
        reagents:
        - ReagentId: Toxin
          Quantity: 5
        - ReagentId: Radium
          Quantity: 5
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: Toxin
        Quantity: 0.1
      - ReagentId: Radium
        Quantity: 0.1

