- type: entity
  name: pool cue
  parent: BaseItem
  id: N14PoolCue
  description: Pool's closed.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/pool_cue.rsi
    state: icon
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.85
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
    angle: 0
    animation: WeaponArcThrust
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 10
    soundHit:
      collection: MetalThud
  - type: Item
    size: Large
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/sledgehammer.rsi
    slots:
    - back
    - suitStorage
  - type: StaticPrice
    price: 1000

