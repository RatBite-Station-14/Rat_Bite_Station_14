# SPDX-License-Identifier: MIT

- type: entity
  name: pointing arrow
  id: PointingArrow
  save: false
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: Interface/Misc/pointing.rsi
    layers:
    - state: pointing
    - state: outline
      map: [ "outline" ]
    drawdepth: Overlays
    noRot: true
  - type: PointingArrow
    duration: 4
    step: 0.5
    speed: 1
  - type: Appearance
