- type: entity
  id: OreScannerConsole
  parent: BaseStructureComputer
  name: ore scanner console
  description: A console that displays nearby ore deposits on a radar-like interface.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: mining
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true }
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUI
    key: enum.OreScannerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.OreScannerUiKey.Key:
        type: OreScannerConsoleBoundUserInterface
  - type: OreScannerConsole
    maxRange: 512
    updateRate: 0.5
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static

- type: entity
  parent: BaseComputerCircuitboard
  id: OreScannerConsoleCircuitboard
  name: ore scanner console board
  description: A computer printed circuit board for an ore scanner console.
  components:
    - type: Sprite
      state: cpu_supply
    - type: ComputerBoard
      prototype: OreScannerConsole