- type: entity
  parent: BaseBullet
  id: BulletMagnum
  categories: [ HideSpawnMenu ]
  name: bullet (.45 magnum)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 45 #Ratbite balance

- type: entity
  parent: BaseBulletPractice
  id: BulletMagnumPractice
  categories: [ HideSpawnMenu ]
  name: bullet (.45 magnum practice)
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 1

- type: entity
  parent: BaseBulletIncendiary
  id: BulletMagnumIncendiary
  categories: [ HideSpawnMenu ]
  name: bullet (.45 magnum incendiary)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 7 # Goobstation
        Heat: 7 # Goobstation

- type: entity
  parent: BaseBullet # Goobstation edit
  id: BulletMagnumAP
  categories: [ HideSpawnMenu ]
  name: bullet (.45 magnum armor-piercing)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40 #Ratbite balance
      armorPenetration: 0.75 # Goobstation

- type: entity
  parent: BaseBulletUranium
  id: BulletMagnumUranium
  categories: [ HideSpawnMenu ]
  name: bullet (.45 magnum uranium)
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 2 #Ratbite balance
        Piercing: 32 #Ratbite balance
      armorPenetration: 0.35 # Ratbite - Uranium ammo rework; magnum deserves some higher amount of AP
  # <Ratbite> - uranium rounds arent INSTANT radiation (ignoring the fact that DU is significantly less radioactive than natural uranium..), duh.
  - type: RefillableSolution
    solution: ammo
  - type: DrainableSolution
    solution: ammo
  - type: SolutionInjectOnProjectileHit
    transferAmount: 2
    solution: ammo
  - type: InjectableSolution
    solution: ammo
  - type: SolutionContainerManager
    solutions:
      ammo:
        reagents:
        - ReagentId: DepletedUranium
          Quantity: 3
  # </Ratbite>
