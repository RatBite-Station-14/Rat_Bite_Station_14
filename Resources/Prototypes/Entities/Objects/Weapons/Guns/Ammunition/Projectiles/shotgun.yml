- type: entity
  parent: BaseBullet
  id: PelletShotgunSlug
  categories: [ HideSpawnMenu ]
  name: pellet (.50 slug)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: slug
  - type: Projectile
    damage:
      types:
        Piercing: 60 #Ratbite balance
        Structural: 15
      armorPenetration: 0.10 # Ratbite - Did you know? Slug pen armor plate yes? Woooow. -Ducks


- type: entity
  parent: BaseBullet
  id: PelletShotgunBeanbag
  categories: [ HideSpawnMenu ]
  name: beanbag (.50)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet #just reapplying to here so it can be shaded
  - type: Projectile
    damage:
      types:
        Blunt: 7.5
  - type: StaminaDamageOnCollide
    damage: 60 # Goob edit

- type: entity
  parent: BaseBullet
  id: PelletShotgun
  categories: [ HideSpawnMenu ]
  name: pellet (.50)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 10
        Structural: 15
      woundSeverityMultipliers:
        Piercing: 1.5 # Minced Meat

- type: entity
  parent: PelletShotgun
  id: PelletShotgunSpread
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: PelletShotgun
    count: 9 # Ratbite - 10*9=90 + bloodloss DOT it's FINEEE
    spread: 10 # Ratbite - tighten up the spread doe

