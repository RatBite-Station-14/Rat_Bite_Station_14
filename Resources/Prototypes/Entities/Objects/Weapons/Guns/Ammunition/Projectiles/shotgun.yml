- type: entity
  parent: BaseBulletPractice
  id: PelletShotgunTranquilizer
  categories: [ HideSpawnMenu ]
  name: pellet (.50 tranquilizer)
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 1
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 15
  - type: SolutionInjectOnProjectileHit
    transferAmount: 15
    solution: ammo

- type: entity
  id: PelletShotgunFlare
  categories: [ HideSpawnMenu ]
  name: pellet (.50 flare)
  components:
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: EmbeddableProjectile
    deleteOnRemove: true
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        mask:
          - BulletImpassable
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: buckshot-flare
  - type: IgnitionSource
    ignited: true
    temperature: 1000
  - type: TimedDespawn
    lifetime: 240
  - type: AmbientSound
    enabled: true
    volume: 0
    range: 7
    sound:
      path: /Audio/Items/Flare/flare_burn.ogg
      params:
        loop: true
  - type: IgniteOnCollide
    fireStacks: 1
  - type: PointLight
    enabled: true
    color: "#FF8080"
    radius: 15.0
    energy: 9.0
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 5

- type: entity
  parent: BaseBulletUranium
  id: PelletShotgunUranium
  categories: [ HideSpawnMenu ]
  name: pellet (.50 uranium)
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 1 # Ratbite - Lingering radiation from DU fragments
        Piercing: 14 # Ratbite
      armorPenetration: 0.25 # Ratbite - Who knew depleted uranium was good at piercing armor?
  # <Ratbite> - uranium rounds arent INSTANT radiation (ignoring the fact that DU is significantly less radioactive than natural uranium..), duh.
  - type: RefillableSolution
    solution: ammo
  - type: DrainableSolution
    solution: ammo
  - type: SolutionInjectOnProjectileHit
    transferAmount: 2
    solution: ammo
  - type: InjectableSolution
    solution: ammo
  - type: SolutionContainerManager
    solutions:
      ammo:
        reagents:
        - ReagentId: DepletedUranium
          Quantity: 0.8
  # </Ratbite>
  

- type: entity
  parent: PelletShotgunUranium
  id: PelletShotgunUraniumSpread
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: PelletShotgunUranium
    count: 5 # 15*5=75 with tight spread and okay AP (and some DOT)
    spread: 6

