- type: entity
  id: BulletRifle
  name: bullet (0.20 rifle)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 25 #Ratbite balance
      armorPenetration: 0.10 # Ratbite

- type: entity
  id: BulletRiflePractice
  name: bullet (0.20 rifle practice)
  parent: BaseBulletPractice
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 2

- type: entity
  id: BulletRifleIncendiary
  parent: BaseBulletIncendiary
  name: bullet (0.20 rifle incendiary)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 6 #Ratbite balance
        Heat: 4 #Ratbite balance

- type: entity
  id: BulletRifleUranium
  parent: BaseBulletUranium
  name: bullet (0.20 rifle uranium)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 2 #Ratbite balance
        Piercing: 18 #Ratbite balance
      armorPenetration: 0.25 # Ratbite - Uranium ammo rework
  # <Ratbite> - uranium rounds arent INSTANT radiation (ignoring the fact that DU is significantly less radioactive than natural uranium..), duh.
  - type: RefillableSolution
    solution: ammo
  - type: DrainableSolution
    solution: ammo
  - type: SolutionInjectOnProjectileHit
    transferAmount: 2
    solution: ammo
  - type: InjectableSolution
    solution: ammo
  - type: SolutionContainerManager
    solutions:
      ammo:
        reagents:
        - ReagentId: DepletedUranium
          Quantity: 1
  # This does about 22 damage total, 4 rad 18 pierce. Worse against unarmored targets, better against armored ones.
  # More precisely: 2 true radiation DOT (100% AP), 2 radiation damage (25% AP), 18 pierce damage (25% AP)
  # </Ratbite>
