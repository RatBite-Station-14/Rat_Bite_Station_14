- type: job
  id: SecurityOfficer
  name: job-name-security
  description: job-description-security
  playTimeTracker: JobSecurityOfficer
  requirements:
    - !type:DepartmentTimeRequirement
      department: Security
      time: 2.5h
    - !type:SpeciesRequirement # Ratbite Bill of Rights "non sentient" species.
      inverted: true
      species:
      - Felinid
      - Scurret
      - Monkey
      - Kobold
    - !type:TraitsRequirement # Ratbite: No NRP traits
      inverted: true
      traits:
      - Trigger
      - SocialAnxietyTrait
      - ChronicKleptomania
      - Nudist
      - Stowaway
  startingGear: SecurityOfficerGear
  icon: "JobIconSecurityOfficer"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides: # goobstation
  - Security
  - LegalSOP
  - OfficerCadetSOP
  - CorporateJudo
  - AlertLevels
  goobcoins: 30 #Goob content
  access:
  - Security
  - Brig
  - Maintenance
  - External
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
      - type: SecurityStaff

- type: startingGear
  id: SecurityOfficerGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    ears: ClothingHeadsetAltSecurityRegular # Goobstation
#    pocket1: WeaponPistolMk58  - Ratbite. Moved to loadouts.
  storage:
    back:
    - Flash
 #   - MagazinePistol  - Ratbite. Moved to loadouts.

- type: chameleonOutfit
  id: SecurityOfficerChameleonOutfit
  job: SecurityOfficer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretSecurity
    mask: ClothingMaskGasSecurity
    neck: Dinkystar
    gloves: ClothingHandsGlovesColorBlack
