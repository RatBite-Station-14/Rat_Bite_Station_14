- type: entity
 parent: BaseGameRule
 id: SubGamemodesRuleSquared # Currently kinda scuffed w/ only 2 side antags, when there's 3-6 it should work better- try and make it select 2 side antags on average when there's 3+
 components:
 - type: SubGamemodes
 rules: # Currently 37.5% chance of thief alone, 37.5% both, 12.5% Devil alone, 12.5% 0 antags- gonna be 10x harder to calculate later lol
 - id: Thief
 prob: 0.75 # Decrease to 0.65-0.4 when there's more antags
 - id: Devil
 prob: 0.5 # Decrease to 0.4-0.3 when there's more antags
 - type: GameRule
 minPlayers: 30

- type: weightedRandom
 id: SecretSquaredMain
 weights:
 # Minor Antags - 76% 
 TraitorMain: 0.38 # should be 2x others
 ChangelingMain: 0.19
 HereticMain: 0.19
 # Major Antags - 24%
 Revolutionary: 0.12
 CosmicCult: 0.12

- type: weightedRandom
 id: SecretSquaredSide
 weights:
 TraitorSide: 0.40 # 2x others
 ChangelingSide: 0.20
 HereticSide: 0.20
 SubGamemodesRuleSquared: 0.20
 

