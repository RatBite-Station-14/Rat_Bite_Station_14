- type: entity
  parent: BaseAction
  id: ActionCoreRoll
  name: Roll core
  description: Warn nearby entities, then roll one tile with a heavy thud, crushing movable objects underneath.
  components:
  - type: Action
    icon: { sprite: Interface/Actions/actions_mecha.rsi, state: mech_cycle_equip_on }
    useDelay: 4
  - type: TargetAction
    range: 0
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CoreRollActionEvent

- type: entity
  parent: BaseAction
  id: ActionToggleAiCoreControl
  name: Roll AI core
  description: Take direct control of the AI core to roll it with movement keys. Press again to return to the AI eye.
  components:
  - type: Action
    checkConsciousness: false
    checkCanInteract: false
    priority: -9
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
  - type: InstantAction
    event: !type:ToggleAiCoreControlActionEvent
