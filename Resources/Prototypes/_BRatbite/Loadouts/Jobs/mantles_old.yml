# Ratbite - alternate loadout entries for the classic (pre-resprite) mantles

# Captain
- type: loadout
  id: CaptainMantleOld
  equipment:
    neck: ClothingNeckMantleCapOld
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobCaptain
      time: 100h

- type: startingGear
  id: CaptainMantleOld
  equipment:
    neck: ClothingNeckMantleCapOld

