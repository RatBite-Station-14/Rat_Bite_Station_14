# This can't be used for everything, because some prototypes override
# the item slot to do the magazines. It can be used for laser guns
# that don't have a magazine or cell
- type: entity
  id: BaseMindshieldedWeapon
  components:
  - type: GunTrackable
  - type: ItemSlots
    slots:
      gun_tracker: &GunTracker
        name: Gun Tracker
        startingItem: GunTracker
        whitelist:
          components:
          - GunTracker
        swap: false
        disableEject: true

- type: entity
  id: BaseMindshieldedPistol
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
      gun_tracker: *GunTracker

- type: entity
  id: WeaponPistonMk58Mindshielded # For when it's inside the armory
  parent: [BaseMindshieldedPistol, WeaponPistolMk58]
  suffix: Minshielded

