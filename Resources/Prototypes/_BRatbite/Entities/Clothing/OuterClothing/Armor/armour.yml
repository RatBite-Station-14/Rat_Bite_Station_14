- type: entity
  parent: [ClothingOuterStorageBase, AllowSuitStorageClothing, BaseCentcommContraband]
  id: ClothingOuterVestWebITOTeamLeader
  name: team leader web vest
  description: A synthetic armor vest for team leader. This one has added webbing and stronger ballistic plates than regular plates.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/webvest.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/webvest.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Chest
    - Groin
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.35
        Heat: 0.4
        Caustic: 0.65
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  - type: StaminaResistance # Goobstation
    damageCoefficient: 0.5

- type: entity
  parent: ClothingOuterVestWebITOTeamLeader
  id: ClothingOuterVestWebITOMedic
