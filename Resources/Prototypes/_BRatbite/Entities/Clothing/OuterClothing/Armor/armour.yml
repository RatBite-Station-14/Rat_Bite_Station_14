  description: A synthetic armor vest for medical operators. This one has space for medical equipment.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Armor/durathread_web_vest.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Armor/durathread_web_vest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.4
        Heat: 0.4
        Caustic: 0.65
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 2
    knockdownTimeDelta: -2

