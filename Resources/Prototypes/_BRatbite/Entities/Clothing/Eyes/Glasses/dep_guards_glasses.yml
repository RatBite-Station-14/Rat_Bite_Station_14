- type: entity
  id: ClothingEyesGlassesCargo
  parent: ClothingEyesGlassesSecurity
  name: cargo insurance glasses
  description: Glasses with a modified security HUD.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/sunglasses.rsi
    layers:
    - state: icon
      color: "#FFA500"
  - type: ClothingGrantComponent # Ratbite, target tracker
    component:
    - type: TargetTracker
      channels: CARGO
  - type: Contraband
    allowedJobs:
    - CargoInsurance

