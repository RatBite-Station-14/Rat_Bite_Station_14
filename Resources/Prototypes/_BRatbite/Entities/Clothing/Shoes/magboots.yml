- type: entity
  parent: [ClothingShoesBootsMagBase, ClothingShoesMilitaryBase, BaseSecurityContraband]
  id: ClothingShoesBootsMagSec
  name: security magboots
  description: Magnetic boots, originally intended for patrolling the outside of the station, now used by security officers to avoid slipping on banana peels
  components:
  - type: Sprite
    sprite: _BRatbite/Clothing/Shoes/Boots/magboots-sec.rsi
    state: icon
  - type: ToggleClothing
    action: ActionToggleSecMagboots
    mustEquip: false
  - type: Clothing
    sprite: _BRatbite/Clothing/Shoes/Boots/magboots-sec.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
      Plastic: 125
  - type: ClothingSpeedModifier # Better than regular magboots, but not as good as advanced ones
    walkModifier: 0.90
    sprintModifier: 0.90
  - type: AccessReader
    access: [["Security"]]


- type: entity
  parent: BaseAction
  id: ActionToggleSecMagboots
  name: Toggle Magboots
  description: Toggles the magboots on and off.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent
  - type: DoAfterArgs
    delay: 1
    breakOnDamage: true
    breakOnWeightlessMove: false
    breakOnMove: true
