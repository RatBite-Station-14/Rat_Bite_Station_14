## These are the spawners that ReinforcementRule spawns.
## It's just a variety of job roles
- type: entity
  abstract: true
  id: BaseEventReinforcement
  name: reinforcement spawner
  components:
  - type: GhostRole
    description: ghost-role-information-event-reinforcement-description
    rules: ghost-role-information-nonantagonist-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
  - type: GhostCharacterSpawner
    components:
    - type: IdBind
    - type: Loadout
      roleLoadout: [ RoleSurvivalStandard ]

- type: entity
  parent: BaseEventReinforcement
  id: EventReinforcementSecurity
  name: security reinforcement
  components:
  - type: GhostRole
    job: SecurityOfficer
    name: ghost-role-information-event-reinforcement-sec-name
  - type: GhostCharacterSpawner
    components:
    - type: Loadout
      prototypes: [ ReinforcementOfficerSpec ]
      roleLoadout: [ RoleSurvivalSecurity ]
    - type: AutoImplant
      implants:
      - MindShieldImplant
    - type: AntagImmune

