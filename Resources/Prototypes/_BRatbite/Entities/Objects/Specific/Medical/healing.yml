  id: Synthskin
  suffix: Full
  components:
  - type: Tag # so that it can go in medical belts
    tags:
    - Gauze
  - type: Sprite
    sprite: _BRatBites/Objects/Specific/Medical/synthskin.rsi
    state: synthskin
  - type: Item
    heldPrefix: synthskin
    storedRotation: -90
  - type: Healing
    damageContainers:
      - Biological
    damage:
