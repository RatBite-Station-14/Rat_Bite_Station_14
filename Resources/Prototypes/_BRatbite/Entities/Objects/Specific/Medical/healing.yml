        Slash: -15
        Blunt: -15
        Heat: -20
        Cold: -20
        Caustic: -20
        Shock: -20
    bloodlossModifier: -15
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
