- type: entity
  name: pill
  suffix: bicaridine 7.5u, meralyne 7.5u
  parent: Pill
  id: PillBicaMera
  components:
  - type: Pill
    pillType: 7
  - type: Sprite
    state: pill7
  - type: Label
    currentLabel: Bicaridine 7.5u, meralyne 7.5u
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Bicaridine
          Quantity: 7.5
        - ReagentId: Meralyne
          Quantity: 7.5

