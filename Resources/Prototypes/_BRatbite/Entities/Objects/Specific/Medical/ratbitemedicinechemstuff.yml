- type: entity
  name: pill
  suffix: bicaridine 7.5u, meralyne 7.5u
  parent: Pill
  id: PillBicarMera
  components:
  - type: Pill
    pillType: 7
  - type: Sprite
    state: pill7
  - type: Label
    currentLabel: Bicaridine 7.5u, meralyne 7.5u
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Bicaridine
          Quantity: 7.5
        - ReagentId: Meralyne
          Quantity: 7.5

- type: entity
  name: brute pill canister
  parent: PillCanister
  id: PillCanisterBicaMera
  suffix: Bicaridine 7.5u, meralyne 7.5u, 15
  components:
  - type: Label
    currentLabel: Bicaridine 7.5u, meralyne 7.5u, 15
  - type: StorageFill
    contents:
    - id: PillBicarMera
      amount: 15

