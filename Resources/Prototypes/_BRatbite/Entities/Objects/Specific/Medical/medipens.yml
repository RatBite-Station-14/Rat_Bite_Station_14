
- type: entity
  name: antistun security auto-injector
  parent: ChemicalMedipen
  id: SecurityStimulantAutoInjector
  description: A rapid dose of synaptizine, ephedrine phoride, dylovene, and ephedrine intended to be used right before being stunned to get you back up almost instantly.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#c7be5d"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#c7be5d"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: _BRatBites/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: Secpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: Secpen_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 20
    onlyAffectsMobs: false
    injectOnly: true
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Synaptizine
          Quantity: 10
        - ReagentId: EphedrinePhoride
          Quantity: 10
        - ReagentId: Dylovene
          Quantity: 7
        - ReagentId: Ephedrine
          Quantity: 3
