- type: entity
  id: PanicButtonBase
  abstract: true
  name: security request button
  description: A small device to alert security of any crimes happening in your department.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/panicbutton.rsi
    layers:
    - state: icon
    - state: top
      color: "#000000"
  - type: PanicButton
    radioChannel: "Security"
  - type: UseDelay
    delay: 45

- type: entity
  id: PanicButtonMedical
  suffix: Medical
  parent: PanicButtonBase
  name: security request button
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: top
      color: "#4B96FF"
  - type: PanicButton
    distressMessage: "panic-button-distress-medical"
    secHudIconColor: "#4B96FF80"

