  name: energy booze dispenser machine board
  description: A machine printed circuit board for an energy chem dispenser.
  components:
    - type: Sprite
      state: service
    - type: MachineBoard
      prototype: EnergyBoozeDispenser
      stackRequirements:
        Manipulator: 1
