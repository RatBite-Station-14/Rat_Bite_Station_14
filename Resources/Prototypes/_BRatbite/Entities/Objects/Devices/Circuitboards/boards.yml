        Steel: 3
      tagRequirements:
        GlassBeaker:
          amount: 2
          defaultPrototype: Beaker

- type: latheRecipe
  id: EnergySodaDispenserMachineCircuitboard
  parent: BaseGoldCircuitboardRecipe
  result: EnergySodaDispenserMachineCircuitboard
  icon:
    sprite: Structures/smalldispensers.rsi
    state: soda

- type: latheRecipe
  id: EnergyBoozeDispenserMachineCircuitboard
