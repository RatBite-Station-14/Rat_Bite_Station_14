- type: entity
  id: EnergySodaDispenserMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: energy soda dispenser machine board
  description: A machine printed circuit board for an energy chem dispenser.
  components:
    - type: Sprite
      state: service
    - type: MachineBoard
      prototype: EnergySodaDispenser
      stackRequirements:
        Manipulator: 1
        Glass: 1
        Steel: 3
      tagRequirements:
        GlassBeaker:
          amount: 2
          defaultPrototype: Beaker

- type: entity
  id: EnergyBoozeDispenserMachineCircuitboard
