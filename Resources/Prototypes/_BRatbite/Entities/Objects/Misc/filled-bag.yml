  parent: MedSupplyCrateBase
  id: MedSupplyCrateViroFilled
  name: medical chemical supply
  suffix: ViroCure
  components:
  - type: StorageFill
    contents:
      - id: JugSpaceacilin
      - id: JugDevirate
      - id: JugImmurin
      - id: JugSpaceacilin
      - id: JugDevirate
      - id: JugImmurin

- type: entity
  parent: MedkitCombat
  id: CombatSurgeryKit
  name: Combat Surgery Kit
  description: A combat surgery kit for treating severe injuries in the field. Contains advance surgery tool.
  components:
  - type: StorageFill
    contents:
      - id: AdvancedBoneGel
      - id: EnergyCautery
      - id: EnergyScalpel
      - id: AdvancedRetractor
