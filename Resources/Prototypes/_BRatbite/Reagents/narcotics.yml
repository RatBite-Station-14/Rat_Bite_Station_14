- type: reagent
  id: Pump-up
  name: reagent-name-pumpup
  group: Narcotics
  desc: reagent-desc-pumpup
  physicalDesc: reagent-physical-desc-robust
  flavor: robust
  color: "#e38e44"
  metabolisms:
    Narcotic:
      metabolismRate: 1 #to make up for it now being a bit more powerful
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType # Goobstation - Yowie
          type: Yowie
        damage:
          groups:
            Brute: -1
          types:
            Heat: -0.5
            Shock: -0.5
            Cold: -0.5
            Radiation: -0.5
      - !type:HealthChange
        conditions:
          - !type:OrganType
            type: Yowie
            shouldHave: false
          - !type:ReagentThreshold
            min: 20 #lowered from 30
        damage:
          types:
            Poison: 2
      - !type:MovespeedModifier
        walkSpeedModifier: 1.2 #changed from 1.1 on both to 1.2 so that it moves you faster than coffee. Ephedrine and desoxy's speed was changed to accommodate for this change
        sprintSpeedModifier: 1.2
      - !type:Jitter 
      - !type:GenericStatusEffect
        key: Stun
        time: 2 #controversial but needed. Closer to (now old) desoxy whilst being stupidly easy to make, balanced because it is consumed faster
        type: Remove
      - !type:GenericStatusEffect
        key: KnockedDown
        time: 2 #Ratbite, same here
        type: Remove
      - !type:GenericStatusEffect 
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 5
      - !type:RemoveComponentEffect
        component: DelayedKnockdown
        locale: reagent-effect-guidebook-remove-delayed-knockdown
      - !type:SuppressPain # Shitmed
        amount: 1.1
        time: 5
      - !type:TakeStaminaDamage
        conditions:
          - !type:ReagentThreshold
            min: 20 #lowered from 30
        amount: 8
        immediate: true
