# biofoam, meralyne, and universal blood replacement (renamed from nanoblood) are from battlefield 14, put in this folder because idk

- type: reagent
  id: Biofoam
  name: reagent-name-biofoam
  group: Medicine
  desc: reagent-desc-biofoam
  physicalDesc: reagent-physical-desc-thick
  flavor: powdery
  color: "#edd9c0"
  worksOnTheDead: true
  metabolisms:
    Medicine:
      metabolismRate: 1
      effects:
      - !type:AdjustReagent
        reagent: BiofoamRemnants
        amount: 0.75
      - !type:EvenHealthChange
        conditions:
        - !type:ReagentThreshold
          max: 10.5
        damage:           # no airloss because I don't get why it would heal that lol
          Brute: -11
          Burn: -11
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 10.5
        damage:
          types:
            Blunt: 10
            Asphyxiation: 8
            Poison: 2
      - !type:ModifyBleedAmount
        amount: -5
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          reagent: Biofoam
          max: 10.5
        visualType: Medium
        messages: ["biofoam-effect-organrepair", "biofoam-effect-bodyrepair"]
        type: Local
        probability: 0.2
      - !type:Jitter
      - !type:AdjustReagent
        conditions:
        - !type:ReagentThreshold
          reagent: Biofoam
          min: 11
          max: 12
        reagent: Biofoam
        amount: -15
      - !type:MovespeedModifier
        walkSpeedModifier: 0.9
        sprintSpeedModifier: 0.9
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          reagent: Biofoam
          min: 10.5
        visualType: MediumCaution
        messages: ["reagent-effect-blunt2", "reagent-effect-asphyxiation", "reagent-effect-poison", "reagent-effect-overdose1"]
        type: Local
        probability: 0.3

