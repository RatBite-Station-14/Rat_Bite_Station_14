- type: entity
  parent: [ MobSiliconBase, StripableInventoryBase ]
  id: MobSecuritron
  name: securitron
  description: Stop breaking the law, asshole
  components:
  - type: Securitron
  - type: Sprite
    sprite: _BRatBites/Mobs/Silicon/Bots/securitron.rsi
    state: securitron
  - type: HTN
    rootTask:
      task: SecuritronCompound
  - type: Anchorable
  - type: InteractionPopup
    interactSuccessString: petting-success-medibot
    interactFailureString: petting-failure-medibot
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_meow.ogg
  - type: Advertise
    pack: MedibotAds
  - type: Vocalizer
  - type: CombatMode
  - type: DatasetVocalizer
    dataset: MedibotAds
  - type: Inventory
    templateId: medibot
  - type: DoAfter
  - type: StationAiVision # Goobstation - AI can see through NT silicon
    range: 1
  - type: Puller
    needsHands: false
  - type: Access # TODO: temp
    groups:
    - AllAccess
