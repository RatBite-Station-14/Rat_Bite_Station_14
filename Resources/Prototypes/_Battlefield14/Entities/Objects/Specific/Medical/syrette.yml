#region Base
- type: entity
  name: syrette
  parent: BaseItem
  description: A miniature single use syringe.
  id: BF14SyretteBase
  abstract: true
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Specific/Medical/syrette.rsi
    layers:
    - state: syrette
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 5
  - type: ExaminableSolution
    solution: pen
  - type: Hypospray
    solutionName: pen
    transferAmount: 10
    onlyAffectsMobs: false
    injectOnly: true
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: syrette_e
  - type: UseDelay
    delay: 0.2
  - type: Appearance
  - type: Tag
    tags:
    - Syrette
  - type: TrashOnSolutionEmpty
    solution: pen

- type: entity
  parent: BF14SyretteBase
  id: BF14SyretteBicaridine
  suffix: Bicaridine
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 5
        reagents:
        - ReagentId: Bicaridine
          Quantity: 5

