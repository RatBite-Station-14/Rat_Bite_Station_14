
- type: entity
  name: troll plushie
  parent: BasePlushie
  description: Feels mischevious.
  suffix: FAKE PLUSH FAKE!!!
  id: TrollNade
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Fun/Plushies/troll.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    size: Normal
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/_Crescent/Weapons/Grenades/troll_nade/trigger.ogg
      params:
        variation: 0.25
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Crescent/Weapons/Grenades/troll_nade/trigger.ogg
      params:
        variation: 0.25
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Crescent/Weapons/Grenades/troll_nade/trigger.ogg
      params:
        variation: 0.25
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_Crescent/Weapons/Grenades/troll_nade/trigger.ogg
      params:
        variation: 0.25
  - type: SpawnItemsOnUse
    items:
      - id: TrollNadeProjectile

- type: entity
  name: The concequences of your actions
  parent: GrenadeBase
  description: WHAT THE FUCK HAVE YOU DONE?????
  categories: [ HideSpawnMenu ]
  id: TrollNadeProjectile
  components:
  - type: TriggerOnSpawn
  - type: Sprite
    sprite: _Crescent/Objects/Fun/Plushies/troll.rsi
    scale: 0.5, 0.5
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    size: Normal
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5000
  - type: ClusterGrenade
    fillPrototype: TrollNadeProjectile
    velocity: 30
    maxGrenadesCount: 30
    grenadeTriggerIntervalMax: 0.25
    grenadeTriggerIntervalMin: 0.0
    baseTriggerDelay: 0.25
    randomSpread: true
  - type: OnUseTimerTrigger
    delay: 0.5
  - type: SoundOnTrigger
    sound:
      path: /Audio/_Crescent/Weapons/Grenades/troll_nade/trigger.ogg
      params:
        variation: 0.25
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/_Crescent/Weapons/Grenades/troll_nade/trigger.ogg
      params:
        variation: 0.25

- type: entity
  name: Chudjak
  description: Billions must die!
  parent: GrenadeBase
  suffix: DO NOT FUCKING MAP
  id: ChudjakNade
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Fun/Plushies/chudjak.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    size: Normal
  - type: OnUseTimerTrigger
    delay: 13
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Minibomb
    totalIntensity: 50000
    intensitySlope: 50
    maxIntensity: 250
  - type: Appearance
  - type: AnimationPlayer
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/_Crescent/Weapons/Grenades/chud_nade/trigger.ogg
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: DeleteOnTrigger

- type: entity
  name: Troll
  parent: GrenadeBase
  description: Dont you fucking dare!
  suffix: UNSTOPABLE CHAOS!
  id: TrollREALNade
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Fun/Plushies/troll.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    size: Normal
  - type: ClusterGrenade
    fillPrototype: TrollNadeProjectile
    velocity: 15
    maxGrenadesCount: 30
    grenadeTriggerIntervalMax: 0.25
    grenadeTriggerIntervalMin: 0.0
    baseTriggerDelay: 0.25
    randomSpread: true
  - type: OnUseTimerTrigger
    delay: 1.5
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/_Crescent/Weapons/Grenades/troll_nade/trigger.ogg
