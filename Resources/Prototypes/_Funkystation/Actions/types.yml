- type: entity
  id: ActionActivateReagentImplant
  name: Inject Reagents
  description: Inject up to 15u of the contained chemicals directly into your bloodstream.
  categories: [ HideSpawnMenu ]
  components:
  # <Ratbite> - changed how this was defined, funky seems to allow for everything to be in InstantAction
  - type: LimitedCharges
    maxCharges: 3
  - type: Action
    checkCanInteract: false
    useDelay: 10 
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Specific/Medical/medipen.rsi
      state: stimpen
  # </Ratbite>
  - type: InstantAction
    event: !type:UseReagentImplantEvent {}